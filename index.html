<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة المندوبين</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; }
        
        /* تنسيق صفحة المدير */
        .admin-container { max-width: 800px; }
        .header { background: #1a73e8; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-right: 5px solid #1a73e8; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .time { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
        .place-name { font-size: 18px; font-weight: bold; color: #333; margin: 5px 0; }
        .details { color: #555; line-height: 1.8; font-size: 14px; }
        .map-btn { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #ea4335; color: white; text-decoration: none; border-radius: 5px; font-size: 13px; }
        .hidden { display: none; }
        #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: #0f9d58; }
        .error { color: #ea4335; }
    </style>
</head>
<body>

<!-- ================= شاشة المندوب ================= -->
<div id="repView" class="container">
    <h2>تسجيل زيارة جديدة</h2>
    
    <input type="text" id="repName" placeholder="اسمك (مثال: أحمد محمود)">
    
    <select id="placeType">
        <option value="عيادة">عيادة</option>
        <option value="صيدلية">صيدلية</option>
        <option value="مركز تجميل">مركز تجميل</option>
        <option value="مستشفى">مستشفى</option>
    </select>

    <input type="text" id="placeName" placeholder="اسم المكان (مثال: عيادة دكتور أحمد)" required>
    <input type="text" id="doctorName" placeholder="اسم الدكتور / المسؤول" required>
    <input type="tel" id="phone" placeholder="رقم الموبايل">
    <input type="text" id="address" placeholder="العنوان">
    
    <textarea id="notes" rows="4" placeholder="ماذا تم عمله مع العميل؟"></textarea>

    <button id="submitBtn" onclick="submitVisit()">📍 حفظ الزيارة</button>
    <div id="statusMsg"></div>
</div>

<!-- ================= شاشة المدير ================= -->
<div id="adminView" class="container admin-container hidden">
    <div class="header">
        <h2 style="margin:0; color:white;">لوحة تحكم المدير</h2>
        <button onclick="loadVisits()" style="width:auto; margin-top:15px; background:white; color:#1a73e8;">تحديث البيانات</button>
    </div>
    <div id="visitsList"></div>
</div>

<script>
    // لينك جوجل شيت بتاعك
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfQ14ZP-3dspsT4fhN9A9KxomvRUZbm6SVKkJ-tX8Jy-aqjABgTTFnSxLRSCqeQaM/exec";

    window.onload = () => {
        if (window.location.hash === '#admin') {
            document.getElementById('repView').classList.add('hidden');
            document.getElementById('adminView').classList.remove('hidden');
            loadVisits();
        } else {
            document.getElementById('repView').classList.remove('hidden');
            document.getElementById('adminView').classList.add('hidden');
            const savedName = localStorage.getItem('repName');
            if(savedName) document.getElementById('repName').value = savedName;
        }
    };

    async function getVisits() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            if(!res.ok) return [];
            return await res.json();
        } catch (e) {
            return [];
        }
    }

    async function submitVisit() {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const repName = document.getElementById('repName').value;
        
        if(!repName) { status.innerHTML = "<span class='error'>من فضلك اكتب اسمك أولاً</span>"; return; }

        btn.disabled = true;
        btn.innerText = "جاري تحديد الموقع...";
        status.innerHTML = "";

        // طلب الموقع مع timeout سريع (8 ثواني)
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                await sendRepData(position.coords.latitude, position.coords.longitude, repName);
                resetBtn(btn);
            },
            async (error) => {
                // لو حصل أي مشكلة في الـ GPS
                status.innerHTML = "<span class='error'>تعذر تحديد الموقع، جاري الحفظ بدون موقع...</span>";
                await sendRepData(null, null, repName);
                resetBtn(btn);
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
    }

    async function sendRepData(lat, lng, repName) {
        const newVisit = {
            time: new Date().toLocaleString('ar-EG'),
            rep: repName,
            place_type: document.getElementById('placeType').value,
            place_name: document.getElementById('placeName').value,
            doctor_name: document.getElementById('doctorName').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            notes: document.getElementById('notes').value,
            lat: lat,
            lng: lng
        };

        localStorage.setItem('repName', repName);

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow', // بيمنع التعليق في الموبايل
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', // بيمنع أخطاء الكورس
                },
                body: JSON.stringify(newVisit)
            });
            
            document.getElementById('placeName').value = '';
            document.getElementById('doctorName').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('address').value = '';
            document.getElementById('notes').value = '';
            
            document.getElementById('statusMsg').innerHTML = "<span class='success'>✅ تم حفظ الزيارة بنجاح!</span>";
        } catch (e) {
            document.getElementById('statusMsg').innerHTML = "<span class='error'>حدث خطأ في الاتصال، حاول مرة أخرى.</span>";
        }
    }

    function resetBtn(btn) {
        btn.disabled = false;
        btn.innerText = "📍 حفظ الزيارة";
    }

    async function loadVisits() {
        const container = document.getElementById('visitsList');
        container.innerHTML = "<p style='text-align:center'>جاري تحميل البيانات...</p>";
        
        const visits = await getVisits();
        
        if(visits.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد زيارات مسجلة بعد.</p>";
            return;
        }

        container.innerHTML = "";
        
        visits.forEach(v => {
            let mapLink = '';
            if(v['رابط الموقع'] && v['رابط الموقع'] !== "") {
                mapLink = `<a href="${v['رابط الموقع']}" target="_blank" class="map-btn">📍 عرض موقع الزيارة على الخريطة</a>`;
            }

            container.innerHTML += `
                <div class="card">
                    <span class="time">${v['التاريخ']} | بواسطة: ${v['المندوب']}</span>
                    <div class="place-name">${v['نوع المكان']} - ${v['اسم المكان']}</div>
                    <div class="details">
                        <strong>المسؤول:</strong> ${v['الدكتور']} <br>
                        <strong>الهاتف:</strong> ${v['التليفون'] || '---'} <br>
                        <strong>العنوان:</strong> ${v['العنوان'] || '---'} <br>
                        <strong>الموقف:</strong> ${v['الملاحظات'] || 'لم يكتب ملاحظات'}
                    </div>
                    ${mapLink}
                </div>
            `;
        });
    }
</script>
</body>
</html>
